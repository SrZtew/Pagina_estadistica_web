# about
about:
  enable: true
  title: "¿Quién soy?"
  content: |
    <p class="lead">
    Soy Sebastián Martínez, estudiante de Ingeniería Electrónica en la Universidad del Magdalena, con formación autodidacta en inteligencia artificial, automatización y programación. Mi enfoque está en traducir la teoría a soluciones prácticas mediante prototipos de IA, controladores en MATLAB y Python, y automatización industrial con PLC.
    </p>
    <p class="lead">
    Me motiva construir herramientas que generen valor: optimización de recursos, reducción de costos y mejora en la eficiencia. Siempre busco aprender, colaborar y aportar soluciones sólidas, bien documentadas y listas para escalar.
    </p>
  button:
    icon: "icon-smile-fill"
    btnText: "Sobre mí"
    URL: "https://www.linkedin.com/in/sebastianmartinezfontlavo"
  image:
    x: "img/who-am-i/user-picture-2.jpg"
    _2x: "img/who-am-i/user-picture-2.jpg"

